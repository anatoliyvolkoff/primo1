<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PriMo Seasons">
<title>The Seasons – PriMo Nails</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preload" href="fonts/montserrat-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone" id="phone" data-idle="true">
  <!-- one full-bleed themed layer per season; cross-faded when the active card changes -->
  <div class="bg" id="bg" aria-hidden="true"></div>

  <main class="stage">
    <header class="head">
      <h1>The Seasons.</h1>
      <p>Pick your mood</p>
    </header>

    <section class="carousel" aria-roledescription="carousel" aria-label="Seasonal collections">
      <div class="track" id="track" tabindex="0"></div>
    </section>

    <div class="dots" id="dots" role="tablist" aria-label="Choose season"></div>

    <button class="cta" id="cta" type="button">I Più Venduti</button>
  </main>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip"></div>
    <h2 id="sheet-title">I Più Venduti</h2>
    <p class="sheet-sub" id="sheet-sub"></p>
    <div class="sheet-grid" id="sheet-grid"></div>
    <button class="cta solid" id="sheet-close" type="button">Done</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
